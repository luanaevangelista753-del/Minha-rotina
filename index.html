<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6750A4"><link rel="manifest" href="manifest.webmanifest"><title>Minha Rotina 3.0</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5fb;font-family:system-ui;color:#29252e}main{max-width:720px;margin:auto;padding:16px 14px 80px}.card,.item{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #0001}.tabs{display:flex;gap:8px;position:sticky;top:0;background:#f7f5fb;padding:8px 0}.tabs button{flex:1}button{border:0;border-radius:12px;padding:11px;font-weight:650}.on,.primary{background:#6750A4;color:#fff}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd5e5;border-radius:11px;margin:5px 0 9px;font:inherit}textarea{min-height:170px}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none}.task{display:flex;align-items:center;gap:9px}.task input{width:22px}.grow{flex:1}.muted{color:#77717f;font-size:12px}.danger{background:#fbe8ed;color:#9b263c}.progress{height:10px;background:#eee9f2;border-radius:20px;overflow:hidden}.bar{height:100%;background:#6750A4}.days{display:flex;gap:6px;overflow:auto}.day{background:white}.day.on{background:#6750A4;color:white}</style></head><body><main>
<div class="tabs"><button id="a" class="on" onclick="tab('r')">✓ Rotina</button><button id="b" onclick="tab('c')">📓 Meu Caderno</button></div>
<section id="r"><div class="card"><h1>Minha Rotina 3.0</h1><b id="count"></b><div class="progress"><div id="bar" class="bar"></div></div></div><div id="days" class="days"></div>
<div class="card"><h2>＋ Nova tarefa</h2><input id="nm" placeholder="Nome da tarefa"><div class="row"><input id="tm" type="time" value="09:00"><input id="ct" placeholder="Categoria"></div><select id="rem"><option value="-1">Sem lembrete</option><option value="0">No horário</option><option value="5">5 min antes</option><option value="10">10 min antes</option><option value="30">30 min antes</option></select><div class="row"><button class="primary" onclick="add()">Adicionar</button><button onclick="notify()">🔔 Permitir notificações</button></div><p class="muted">Os lembretes funcionam quando o navegador/PWA permite notificações. Alertas com o app totalmente fechado podem ser limitados pelo Android.</p></div><div id="tasks"></div></section>
<section id="c" class="hidden"><div class="card"><h1>Meu Caderno</h1><input id="search" placeholder="Pesquisar anotações" oninput="notes()"><button class="primary" onclick="newNote()">＋ Nova anotação</button></div><div id="ed" class="card hidden"><input id="title" placeholder="Título"><textarea id="text" placeholder="Escreva aqui..."></textarea><div class="row"><button class="primary" onclick="saveNote()">Salvar</button><button onclick="ed.classList.add('hidden')">Cancelar</button></div></div><div id="notes"></div></section>
<script>
const DN=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];let day=new Date().getDay(),eid=null;
const base=[["07:00","Acordar","Rotina"],["07:05","Versículo + oração + louvor","Espiritual"],["07:20","Escovar os dentes + banho","Higiene"],["07:40","Exercícios","Saúde"],["08:10","Café da manhã","Alimentação"],["08:40","Afazeres da casa","Casa"],["12:00","Almoço + escovar os dentes","Alimentação"],["17:30","Versículo + oração + louvor","Espiritual"],["19:00","Banho","Higiene"],["19:30","Café da noite/jantar","Alimentação"],["20:00","Estudo bíblico","Espiritual"],["21:00","Oração + louvor","Espiritual"],["22:00","Começar a desacelerar","Sono"],["22:30","Ir para a cama","Sono"],["23:00","Dormir","Sono"]];
function data(){let x=JSON.parse(localStorage.getItem("v3tasks")||"null");if(!x){x=[];for(let d=0;d<7;d++){base.forEach((t,i)=>x.push({id:`b${d}-${i}`,day:d,time:t[0],name:t[1],cat:t[2],rem:-1}));if(d>0&&d<6)[["09:30","Comunicação — 10 min","Estudos"],["09:45","Excel","Estudos"],["10:40","RH","Estudos"]].forEach((t,i)=>x.push({id:`s${d}-${i}`,day:d,time:t[0],name:t[1],cat:t[2],rem:-1}))}localStorage.setItem("v3tasks",JSON.stringify(x))}return x}function put(x){localStorage.setItem("v3tasks",JSON.stringify(x))}
function tab(x){r.classList.toggle("hidden",x!="r");c.classList.toggle("hidden",x!="c");a.classList.toggle("on",x=="r");b.classList.toggle("on",x=="c");if(x=="c")notes()}
function render(){days.innerHTML="";DN.forEach((n,i)=>{let q=document.createElement("button");q.className="day "+(i==day?"on":"");q.textContent=n;q.onclick=()=>{day=i;render()};days.appendChild(q)});let x=data().filter(z=>z.day==day).sort((p,q)=>p.time.localeCompare(q.time));tasks.innerHTML="";x.forEach(t=>{let done=localStorage.getItem("d"+t.id)=="1",e=document.createElement("div");e.className="item task";e.innerHTML=`<input type=checkbox ${done?"checked":""}><b>${t.time}</b><div class=grow><b>${esc(t.name)}</b><div class=muted>${esc(t.cat)} ${t.rem>=0?" • 🔔 "+(t.rem==0?"no horário":t.rem+" min antes"):""}</div></div><button class=danger>×</button>`;e.querySelector("input").onchange=v=>{localStorage.setItem("d"+t.id,v.target.checked?"1":"0");render()};e.querySelector(".danger").onclick=()=>{if(confirm("Excluir tarefa?")){put(data().filter(z=>z.id!=t.id));render()}};tasks.appendChild(e)});let z=x.filter(t=>localStorage.getItem("d"+t.id)=="1").length;count.textContent=`${z} de ${x.length} concluídas`;bar.style.width=(x.length?z/x.length*100:0)+"%"}
function add(){if(!nm.value.trim())return alert("Digite o nome.");let x=data();x.push({id:"u"+Date.now(),day,time:tm.value,name:nm.value.trim(),cat:ct.value.trim()||"Geral",rem:Number(rem.value)});put(x);nm.value="";render()}
async function notify(){if(!("Notification"in window))return alert("Notificações não disponíveis.");let p=await Notification.requestPermission();alert(p=="granted"?"Notificações permitidas.":"Permissão não concedida.")}
setInterval(()=>{if(!("Notification"in window)||Notification.permission!="granted")return;let n=new Date();data().filter(t=>t.day==n.getDay()&&t.rem>=0).forEach(t=>{let [h,m]=t.time.split(":").map(Number),w=new Date(n);w.setHours(h,m-t.rem,0,0);if(Math.abs(n-w)<30000){let k=t.id+n.toDateString();if(!sessionStorage[k]){new Notification("Minha Rotina",{body:t.name});sessionStorage[k]="1"}}})},15000);
function nd(){return JSON.parse(localStorage.getItem("v3notes")||"[]")}function np(x){localStorage.setItem("v3notes",JSON.stringify(x))}
function newNote(){eid=null;title.value="";text.value="";ed.classList.remove("hidden")}
function saveNote(){if(!title.value.trim()&&!text.value.trim())return;let x=nd(),u=new Date().toLocaleString("pt-BR");if(eid){let n=x.find(z=>z.id==eid);n.title=title.value||"Sem título";n.text=text.value;n.updated=u}else x.unshift({id:"n"+Date.now(),title:title.value||"Sem título",text:text.value,updated:u});np(x);ed.classList.add("hidden");notes()}
function notes(){let q=(search.value||"").toLowerCase();window.notes.innerHTML="";nd().filter(n=>(n.title+" "+n.text).toLowerCase().includes(q)).forEach(n=>{let e=document.createElement("div");e.className="item";e.innerHTML=`<h3>${esc(n.title)}</h3><div class=muted>${esc(n.updated)}</div><p>${esc(n.text).slice(0,300)}</p><div class=row><button>Editar</button><button class=danger>Excluir</button></div>`;e.children[3].children[0].onclick=()=>{eid=n.id;title.value=n.title;text.value=n.text;ed.classList.remove("hidden")};e.children[3].children[1].onclick=()=>{if(confirm("Excluir anotação?")){np(nd().filter(z=>z.id!=n.id));notes()}};window.notes.appendChild(e)})}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
