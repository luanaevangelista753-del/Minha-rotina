<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6750A4"><link rel="manifest" href="manifest.webmanifest">
<title>Minha Rotina</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#25232a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:auto;padding:20px 16px 80px}.hero{background:#fff;border-radius:22px;padding:20px;box-shadow:0 5px 22px #00000012}
h1{margin:0 0 5px}.muted,.cat{color:#77717f}.progress{height:11px;background:#ebe7f1;border-radius:20px;overflow:hidden;margin-top:12px}
#bar{height:100%;background:#6750A4}.days{display:flex;gap:7px;overflow:auto;padding:16px 0}.day{border:0;background:#fff;border-radius:14px;padding:10px 13px}
.day.on{background:#6750A4;color:#fff}.task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 2px 10px #0000000d}
.task.done .name{text-decoration:line-through;opacity:.55}.time{font-weight:750;min-width:53px}.name{font-weight:650}.cat{font-size:12px;margin-top:3px}
input{width:22px;height:22px;accent-color:#6750A4}.reset{width:100%;padding:12px;margin-top:15px;border:1px solid #ddd5e7;border-radius:14px;background:white}
small{display:block;margin-top:14px;color:#77717f}
</style></head><body><main>
<div class="hero"><h1>Minha Rotina</h1><div class="muted">Um dia de cada vez 💜</div><b id="count"></b><div class="progress"><div id="bar"></div></div></div>
<div id="days" class="days"></div><div id="tasks"></div><button class="reset" onclick="resetDay()">Desmarcar tarefas deste dia</button>
<small>Meta de sono: 23h–7h. As marcações ficam salvas no aparelho.</small>
</main><script>
const N=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const B=[["07:00","Acordar","Rotina"],["07:05","Versículo + oração + louvor","Espiritual"],["07:20","Escovar os dentes + banho","Higiene"],["07:40","Exercícios","Saúde"],["08:10","Café da manhã","Alimentação"],["08:40","Afazeres da casa","Casa"],["12:00","Almoço + escovar os dentes","Alimentação"],["17:30","Versículo + oração + louvor","Espiritual"],["19:00","Banho","Higiene"],["19:30","Café da noite/jantar + escovar os dentes","Alimentação"],["20:00","Estudo bíblico","Espiritual"],["21:00","Oração + louvor","Espiritual"],["22:00","Começar a desacelerar","Sono"],["22:30","Ir para a cama","Sono"],["23:00","Dormir","Sono"]];
const S=[["09:30","Comunicação — 10 min","Estudos"],["09:45","Excel","Estudos"],["10:40","RH","Estudos"]];
let d=new Date().getDay();
function list(x){let a=[...B];if(x>=1&&x<=5)a.push(...S);if(x==2)a.push(["08:05","Dia de jejum","Espiritual"]);if(x==3)a.push(["15:00","Lavar cabelo + depilação","Autocuidado"]);if(x==6)a.push(["14:00","Unhas + sobrancelha","Autocuidado"],["15:00","Lavar cabelo + depilação","Autocuidado"]);return a.sort((a,b)=>a[0].localeCompare(b[0]))}
function k(i){return "mr-"+d+"-"+i}
function render(){days.innerHTML="";N.forEach((n,i)=>{let b=document.createElement("button");b.className="day "+(i==d?"on":"");b.textContent=n;b.onclick=()=>{d=i;render()};days.appendChild(b)});
let a=list(d);tasks.innerHTML="";a.forEach((t,i)=>{let ok=localStorage.getItem(k(i))=="1",e=document.createElement("label");e.className="task "+(ok?"done":"");e.innerHTML=`<input type=checkbox ${ok?"checked":""}><div class=time>${t[0]}</div><div><div class=name>${t[1]}</div><div class=cat>${t[2]}</div></div>`;e.querySelector("input").onchange=v=>{localStorage.setItem(k(i),v.target.checked?"1":"0");render()};tasks.appendChild(e)});
let c=a.filter((_,i)=>localStorage.getItem(k(i))=="1").length;count.textContent=`${c} de ${a.length} concluídas`;bar.style.width=(100*c/a.length)+"%"}
function resetDay(){list(d).forEach((_,i)=>localStorage.removeItem(k(i)));render()}render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
